services:
  core:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: core
    init: true
    environment:
      WORKBENCH_TOKEN: ${WORKBENCH_TOKEN:-local-preview}
      RUNNER_URL: http://runner:8200
      TOOL_API_URL: http://core:8000
      WORKSTATION_DATA: /data
    volumes:
      - workstation-data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8032}:8000"
    networks: [workspace, repair]
    depends_on:
      runner: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15

  runner:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: runner
    init: true
    env_file:
      - path: .env.models
        required: false
    volumes:
      - ./solution:/app/solution:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    networks: [repair]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15

  frontend:
    build: ./frontend
    init: true
    environment:
      BACKEND_URL: http://core:8000
      WORKBENCH_TOKEN: ${WORKBENCH_TOKEN:-local-preview}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-5192}:5173"
    networks: [workspace]
    depends_on:
      core: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: tests
    network_mode: none

networks:
  workspace:
  repair:

volumes:
  workstation-data:
